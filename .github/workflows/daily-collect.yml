name: Daily Collect

on:
  # 测试期间关闭自动定时任务，只手动触发，避免意外消耗Apify额度
  # 正式运行时取消下面注释
  # schedule:
  #   # 每天北京时间06:00 (UTC 22:00)
  #   - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式 (true=小数据量, false=正式采集)'
        required: false
        default: 'true'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'true' }}
        run: python scripts/collect.py

      - name: Commit and push results
        run: |
          git config --local user.email "printverse-bot@users.noreply.github.com"
          git config --local user.name "PrintVerse Bot"
          git pull origin main --rebase || true
          git add data/
          git diff --staged --quiet || git commit -m "🤖 采集更新: $(date +'%Y-%m-%d') (测试模式)"
          git push origin main
