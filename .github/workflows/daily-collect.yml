name: Daily Collect & Generate Variants

on:
  schedule:
    # 每天北京时间06:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: '采集平台 (all/temu/shein/etsy)'
        required: false
        default: 'all'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/collect.py

      - name: Run variant generation
        env:
          AI_IMAGE_API_KEY: ${{ secrets.AI_IMAGE_API_KEY }}
          AI_IMAGE_API_ENDPOINT: ${{ secrets.AI_IMAGE_API_ENDPOINT }}
          AI_IMAGE_API_PROVIDER: ${{ secrets.AI_IMAGE_API_PROVIDER }}
        run: |
          python scripts/generate_variant.py

      - name: Commit and push results
        run: |
          git config --local user.email "printverse-bot@users.noreply.github.com"
          git config --local user.name "PrintVerse Bot"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 每日采集更新: $(date +'%Y-%m-%d')"
          git push
