name: Generate Variants

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '处理商品数量上限 (0=全部)'
        required: false
        default: '5'
      variants_per_product:
        description: '每个商品生成几个变体'
        required: false
        default: '2'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run variant generation
        env:
          AI_IMAGE_API_KEY: ${{ secrets.AI_IMAGE_API_KEY }}
          AI_IMAGE_API_ENDPOINT: ${{ secrets.AI_IMAGE_API_ENDPOINT }}
          AI_IMAGE_API_PROVIDER: ${{ secrets.AI_IMAGE_API_PROVIDER }}
          VARIANT_LIMIT: ${{ github.event.inputs.limit || '5' }}
          VARIANTS_PER_PRODUCT: ${{ github.event.inputs.variants_per_product || '2' }}
        run: python scripts/generate_variant.py

      - name: Commit and push variants
        run: |
          git config --local user.email "printverse-bot@users.noreply.github.com"
          git config --local user.name "PrintVerse Bot"
          git pull origin main --rebase || true
          git add data/variants/
          git diff --staged --quiet || git commit -m "🎨 变体生成: $(date +'%Y-%m-%d %H:%M')"
          git push origin main
