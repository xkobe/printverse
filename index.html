/* ===== 素材库管理功能 ===== */
function getAssets() { return DB.get('assets', []); }
function saveAssets(list) { DB.set('assets', list); }
function toggleAssetStatus(id) {
  const list = getAssets();
  const item = list.find(a => a.id === id);
  if (item) {
    item.status = item.status === '上架' ? '下架' : '上架';
    saveAssets(list);
    toast('素材已' + item.status);
    render();
  }
}
function deleteAsset(id) {
  if (!confirm('确定删除此素材？此操作不可恢复。')) return;
  const list = getAssets().filter(a => a.id !== id);
  saveAssets(list);
  toast('素材已删除');
  render();
}
function editAsset(id) {
  const list = getAssets();
  const item = list.find(a => a.id === id);
  if (!item) return;
  const newTitle = prompt('编辑素材标题：', item.title);
  if (newTitle && newTitle.trim()) {
    item.title = newTitle.trim();
    saveAssets(list);
    toast('素材已更新');
    render();
  }
}

/* ===== 用户管理功能 ===== */
function getUsers() { return DB.get('users', []); }
function saveUsers(list) { DB.set('users', list); }
function toggleUserStatus(id) {
  const list = getUsers();
  const user = list.find(u => u.id === id);
  if (user) {
    user.status = user.status === '正常' ? '已封禁' : '正常';
    saveUsers(list);
    toast('用户已' + (user.status === '正常' ? '解封' : '封禁'));
    render();
  }
}
function adjustUserPoints(id) {
  const list = getUsers();
  const user = list.find(u => u.id === id);
  if (!user) return;
  const delta = prompt('调整点数（正数增加，负数扣除）：', '100');
  if (delta && !isNaN(parseInt(delta))) {
    user.points = Math.max(0, user.points + parseInt(delta));
    saveUsers(list);
    toast('点数已调整，当前余额：' + user.points);
    render();
  }
}

/* ===== 黑名单功能 ===== */
function getBlacklist() { return DB.get('blacklist', []); }
function saveBlacklist(list) { DB.set('blacklist', list); }
function addBl() {
  const input = document.getElementById('blInput');
  const word = input ? input.value.trim() : '';
  if (!word) { toast('请输入关键词'); return; }
  const list = getBlacklist();
  if (list.includes(word)) { toast('关键词已存在'); return; }
  list.push(word);
  saveBlacklist(list);
  toast('已添加：' + word);
  render();
}
function removeBl(word) {
  const list = getBlacklist().filter(w => w !== word);
  saveBlacklist(list);
  toast('已移除：' + word);
  render();
}

/* ===== 审核功能 ===== */
function getReviewQueue() { return DB.get('review_queue', []); }
function saveReviewQueue(list) { DB.set('review_queue', list); }
function approveAsset(id) {
  const queue = getReviewQueue();
  const item = queue.find(a => a.id === id);
  if (!item) return;
  // 加入素材库
  const assets = getAssets();
  const newId = assets.length > 0 ? Math.max(...assets.map(a => a.id), 0) + 1 : 1;
  const today = new Date().toISOString().split('T')[0];
  assets.unshift({
    id: newId,
    title: item.title,
    platform: item.platform || 'Temu',
    period: item.period || 'daily',
    style: item.style || 'AI生成',
    topic: item.topic || '热销款',
    cost: 0,
    hot: item.hot || false,
    image: item.image,
    date: item.date || today,
    downloads: 0,
    status: '上架',
    createdAt: new Date().toISOString()
  });
  saveAssets(assets);
  // 从审核队列移除
  saveReviewQueue(queue.filter(a => a.id !== id));
  toast('已通过并上架到素材库');
  render();
}
function rejectAsset(id) {
  if (!confirm('确定拒绝此素材？')) return;
  const queue = getReviewQueue().filter(a => a.id !== id);
  saveReviewQueue(queue);
  toast('已拒绝');
  render();
}

/* ===== 任务功能 ===== */
function getTasks() { return DB.get('tasks', []); }
function addTask(name, type) {
  const tasks = getTasks();
  tasks.unshift({id: Date.now(), name, type, status:'running', progress:0, createdAt:new Date().toLocaleString(), result:'执行中...'});
  DB.set('tasks', tasks);
  // 模拟进度
  let progress = 0;
  const timer = setInterval(() => {
    progress += 20;
    const t = getTasks().find(x => x.name === name && x.status === 'running');
    if (t) {
      t.progress = Math.min(progress, 100);
      if (progress >= 100) {
        t.status = 'success';
        t.result = type === 'collect' ? '采集完成，成功9条' : '生成完成，8张变体';
        clearInterval(timer);
      }
      DB.set('tasks', getTasks());
      if (STATE.adminTab === 'tasks') render();
    }
  }, 800);
}

// 动态采集数据（从products.json加载）
let PRODUCTS_DATA = null;
let PRODUCTS_LOADING = false;
async function loadProductsData(force){
  if(PRODUCTS_DATA && !force) return PRODUCTS_DATA;
  if(PRODUCTS_LOADING) return null;
  PRODUCTS_LOADING = true;
  try{
    const r = await fetch('data/products.json?_t='+Date.now());
    if(r.ok){ PRODUCTS_DATA = await r.json(); }
  }catch(e){ console.warn('products.json加载失败', e); }
  PRODUCTS_LOADING = false;
  // 如果当前在采集管理页，自动刷新
  if(typeof render === 'function' && STATE && STATE.mode==='admin' && STATE.adminTab==='collect'){
    render();
  }
  return PRODUCTS_DATA;
}
async function refreshCollectData(){
  toast('正在从GitHub拉取最新采集数据...');
  await loadProductsData(true);
  toast('数据已刷新，共'+(PRODUCTS_DATA?PRODUCTS_DATA.total:0)+'条');
}

// GitHub API 配置与触发

/* ===== GitHub API集成 ===== */
function getGithubToken(){
  // 优先从系统设置读取，其次从独立存储读取
  try {
    const settings = JSON.parse(localStorage.getItem('ph_settings') || '{}');
    if(settings.githubToken) return settings.githubToken;
  } catch(e){}
  return localStorage.getItem('printhunt_gh_token') || '';
}
function saveGithubToken(){
  const input = document.getElementById('gh-token-input');
  if(input){
    const token = input.value.trim();
    localStorage.setItem('printhunt_gh_token', token);
    // 同时保存到系统设置
    try {
      const settings = JSON.parse(localStorage.getItem('ph_settings') || '{}');
      settings.githubToken = token;
      localStorage.setItem('ph_settings', JSON.stringify(settings));
    } catch(e){}
    toast('GitHub Token已保存');
  }
}
async function triggerVariantWorkflow(limit, variantsPerProduct){
  const token = getGithubToken();
  if(!token){ toast('请先在「Apify配置」页面填写GitHub Token'); STATE.adminTab='settings'; render(); return; }
  toast('正在触发生成变体任务...');
  try{
    const resp = await fetch('https://api.github.com/repos/xkobe/printverse/actions/workflows/generate-variant.yml/dispatches', {
      method: 'POST',
      headers: { 'Authorization': 'token '+token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main', inputs: { limit: String(limit||5), variants_per_product: String(variantsPerProduct||2) } })
    });
    if(resp.status === 204){
      toast('✅ 变体生成任务已触发！GitHub Actions正在执行，约2-5分钟完成');
      // 3秒后开始轮询状态
      setTimeout(pollVariantStatus, 5000);
    } else {
      const err = await resp.json().catch(()=>({message:resp.statusText}));
      toast('❌ 触发失败: '+(err.message || resp.status));
    }
  }catch(e){ toast('❌ 网络错误: '+e.message); }
}
async function pollVariantStatus(){
  const token = getGithubToken();
  if(!token) return;
  try{
    const resp = await fetch('https://api.github.com/repos/xkobe/printverse/actions/runs?per_page=1', {
      headers: { 'Authorization': 'token '+token, 'Accept': 'application/vnd.github.v3+json' }
    });
    const data = await resp.json();
    if(data.workflow_runs && data.workflow_runs.length>0){
      const run = data.workflow_runs[0];
      if(run.status === 'completed'){
        if(run.conclusion === 'success'){
          toast('✅ 变体生成完成！点击「刷新数据」查看结果');
        } else {
          toast('⚠️ 变体生成失败: '+run.conclusion);
        }
      } else {
        toast('变体生成中... ('+run.status+')，继续等待');
        setTimeout(pollVariantStatus, 10000);
      }
    }
  }catch(e){ console.warn('轮询失败', e); }
}
async function triggerCollectWorkflow(){
  const token = getGithubToken();
  if(!token){ toast('请先在「Apify配置」页面填写GitHub Token'); STATE.adminTab='settings'; render(); return; }
  toast('正在触发采集任务...');
  try{
    const resp = await fetch('https://api.github.com/repos/xkobe/printverse/actions/workflows/daily-collect.yml/dispatches', {
      method: 'POST',
      headers: { 'Authorization': 'token '+token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main', inputs: { test_mode: 'true' } })
    });
    if(resp.status === 204){
      toast('✅ 采集任务已触发！约1-2分钟完成，完成后点击「刷新数据」');
    } else {
      const err = await resp.json().catch(()=>({message:resp.statusText}));
      toast('❌ 触发失败: '+(err.message || resp.status));
    }
  }catch(e){ toast('❌ 网络错误: '+e.message); }
}
function productsToCollectItems(data){
  if(!data || !data.products) return COLLECT_ITEMS;
  return data.products.map(function(p,i){
    // 适配多种数据结构（真实采集/模拟数据）
    const platform = p.platform ? (typeof p.platform === 'string' ? p.platform.charAt(0).toUpperCase()+p.platform.slice(1) : 'Temu') : 'Temu';
    const sales = p.sales || p.sales_tip || p.salesCount || '-';
    const rating = p.rating || (p.comment ? p.comment.goods_score : null);
    const reviewCount = p.reviews || p.reviewCount || (p.comment ? p.comment.comment_num_tips : null);
    const price = typeof p.price === 'number' ? (p.price < 100 ? '$'+p.price.toFixed(2) : '$'+(p.price/100).toFixed(2)) : (p.price || '$0.00');
    const period = p.period === 'weekly' || p.period === '周榜' ? '周榜' : '日榜';
    const collectedAt = p.collectedAt ? p.collectedAt.slice(0,16).replace('T',' ') : (data.collectedAt ? data.collectedAt.slice(0,16).replace('T',' ') : (data.updated_at ? data.updated_at.slice(0,16).replace('T',' ') : '2026-09-08 08:00'));
    const rank = p.rank || (i+1);
    return {
      id:'RC'+String(i+1).padStart(3,'0'),
      platform:platform,
      title:p.title || p.name || '未命名商品',
      sales:sales,
      trend:'+'+Math.floor(Math.random()*200+30)+'%',
      rank:rank,
      period:period,
      image:p.image || p.mainImage || p.photo || '',
      status:'待变体',
      variantId:null,
      collectedAt:collectedAt,
      price:price,
      rating:rating,
      reviewCount:reviewCount,
      url:p.url || p.productUrl || p.link || '',
      keyword:p.keyword || ''
    };
  });
}

  document.querySelectorAll('.nav-link').forEach(el=>{

  const t=document.createElement('div');t.className='toast';t.textContent=msg;

}

        el.style.color='#fff';
        el.style.fontWeight='600';

        el.style.background='#fff';
        el.style.color='#666';
        el.style.fontWeight='400';
        el.style.borderColor='#e0e0e0';
      }
    });
  }
  // 更新计数
  const cnt=document.getElementById('feedCount');
  if(cnt)cnt.textContent='共 '+list.length+' 款';
  // 局部更新列表

function renderGallery(){
  const assets = getAssets();
  const timeFilter = STATE.galleryTime || 'all';
  const platformFilter = STATE.galleryPlatform || 'all';
  const kw = STATE.gallerySearch || '';

  // 时间筛选
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  const weekAgo = new Date(now.getTime() - 7*24*60*60*1000).toISOString().split('T')[0];
  const monthAgo = new Date(now.getTime() - 30*24*60*60*1000).toISOString().split('T')[0];

  let filtered = assets.filter(a => {
    if (a.status === '下架') return false;
    const d = a.date || a.createdAt?.split('T')[0] || today;
    if (timeFilter === 'today' && d !== today) return false;
    if (timeFilter === 'week' && d < weekAgo) return false;
    if (timeFilter === 'month' && d < monthAgo) return false;
    if (platformFilter !== 'all' && a.platform !== platformFilter) return false;
    if (kw && !a.title.toLowerCase().includes(kw.toLowerCase()) && !a.style.toLowerCase().includes(kw.toLowerCase())) return false;
    return true;
  });

  // 按日期分组
  const groups = {};
  filtered.forEach(a => {
    const d = a.date || a.createdAt?.split('T')[0] || today;
    if (!groups[d]) groups[d] = [];
    groups[d].push(a);
  });
  const dates = Object.keys(groups).sort().reverse();

  const timeTabs = [
    {key:'all', label:'全部'},
    {key:'today', label:'今天'},
    {key:'week', label:'本周'},
    {key:'month', label:'本月'}
  ];
  const platforms = ['all','Temu','手动上传'];

  return `<div style="background:var(--bg);min-height:calc(100vh - 60px)">
    <div style="max-width:1280px;margin:0 auto;padding:24px 20px">
      <!-- 页面标题 -->
      <div style="margin-bottom:20px">
        <h1 style="font-size:28px;font-weight:800;color:var(--text-1);margin:0 0 6px">印花素材库</h1>
        <p style="font-size:14px;color:var(--text-3);margin:0">按时间浏览所有热销变体图案，共 ${filtered.length} 款可用素材</p>
      </div>

      <!-- 筛选栏 -->
      <div style="background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:14px 18px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <!-- 时间筛选 -->
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:13px;color:var(--text-2);font-weight:600">时间：</span>
          <div style="display:flex;gap:4px;background:var(--bg-soft);border-radius:6px;padding:3px">
            ${timeTabs.map(t => `<button onclick="STATE.galleryTime='${t.key}';render()" style="padding:6px 14px;border:none;border-radius:5px;font-size:12px;cursor:pointer;transition:all .15s;${STATE.galleryTime===t.key || (!STATE.galleryTime && t.key==='all')?'background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)':'color:var(--text-2);background:transparent'}">${t.label}</button>`).join('')}
          </div>
        </div>
        <!-- 平台筛选 -->
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:13px;color:var(--text-2);font-weight:600">平台：</span>
          <select onchange="STATE.galleryPlatform=this.value;render()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff">
            ${platforms.map(p => `<option value="${p}" ${STATE.galleryPlatform===p || (!STATE.galleryPlatform && p==='all')?'selected':''}>${p==='all'?'全部来源':p}</option>`).join('')}
          </select>
        </div>
        <!-- 搜索 -->
        <div style="flex:1;min-width:200px;display:flex;gap:8px">
          <input type="text" placeholder="搜索图案标题或风格..." value="${kw}" onkeyup="if(event.key==='Enter'){STATE.gallerySearch=this.value;render()}" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">
          <button onclick="STATE.gallerySearch=this.previousElementSibling.value;render()" style="padding:8px 18px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer">搜索</button>
        </div>
        <button onclick="STATE.galleryTime='all';STATE.galleryPlatform='all';STATE.gallerySearch='';render()" style="padding:8px 14px;background:transparent;color:var(--text-3);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer">重置</button>
      </div>

      <!-- 按日期分组展示 -->
      ${dates.length === 0 ? `<div style="text-align:center;padding:80px 20px"><div style="font-size:48px;margin-bottom:16px">🔍</div><div style="font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:8px">没有找到匹配的图案</div><div style="font-size:13px;color:var(--text-3)">试试调整筛选条件或重置筛选</div></div>` :
      dates.map(date => {
        const dateObj = new Date(date);
        const dateLabel = dateObj.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
        return `<div style="margin-bottom:32px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
            <div style="width:4px;height:20px;background:var(--primary);border-radius:2px"></div>
            <h2 style="font-size:16px;font-weight:700;color:var(--text-1);margin:0">${dateLabel}</h2>
            <span style="font-size:12px;color:var(--text-3)">${groups[date].length} 款</span>
          </div>
          <div style="column-count:4;column-gap:16px">
            ${groups[date].map(a => assetCard(a)).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function downloadAsset(id){
  // 从localStorage素材库查找（包含审核上架的新素材）
  const assets = getAssets();
  let a = assets.find(x=>x.id==id);
  // 兜底：从默认数据查找
  if(!a) a = ASSETS.find(x=>x.id==id);
  if(!a){toast('图案不存在');return;}
  // 判断是否当天更新
  const today=new Date().toISOString().split('T')[0];
  const isToday=a.date===today;
  // 当天更新的免费下载（无需登录），过期需要登录
  if(!isToday && !STATE.user.loggedIn){
    toast('该图案为历史更新，需注册登录后下载');
    setTimeout(()=>navigate('login'),1200);
    return;
  }
  // 模拟下载：创建临时链接下载图片
  if(a.image){
    try{
      const link = document.createElement('a');
      link.href = a.image;
      link.download = 'printhunt_' + (a.title || 'design').replace(/[^a-zA-Z0-9]/g,'_').substring(0,30) + '.png';
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(e){
      console.warn('下载失败:', e);
    }
  }
  // 更新下载次数
  if(a.downloads !== undefined){
    a.downloads = (a.downloads || 0) + 1;
    saveAssets(assets);
  }
  // 下载成功
  toast(isToday?'✅ 下载成功（当日免费）':'✅ 下载成功，商用授权已生效');
}

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !email.includes('@')){ toast('请输入正确的邮箱地址'); return; }
  if(!password || password.length < 6){ toast('密码至少6位'); return; }
  // 检查用户是否已注册
  const users = DB.get('users', []);
  const user = users.find(u => u.email === email);
  if(user && user.password !== password){
    toast('密码错误，请重试');
    return;
  }
  STATE.user.name = email.split('@')[0];
  STATE.user.email = email;
  STATE.user.loggedIn = true;
  // 持久化登录状态
  localStorage.setItem('printhunt_user', JSON.stringify(STATE.user));
  toast('登录成功，欢迎回来');
  navigate('home');
}

function doRegister(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const password2 = document.getElementById('loginPassword2').value;
  if(!email || !email.includes('@')){ toast('请输入正确的邮箱地址'); return; }
  if(!password || password.length < 6){ toast('密码至少6位'); return; }
  if(password !== password2){ toast('两次输入的密码不一致'); return; }
  // 检查邮箱是否已注册
  const users = DB.get('users', []);
  if(users.find(u => u.email === email)){
    toast('该邮箱已注册，请直接登录');
    return;
  }
  // 保存用户数据
  users.push({email, password, name: email.split('@')[0], createdAt: new Date().toISOString()});
  DB.set('users', users);
  STATE.user.name = email.split('@')[0];
  STATE.user.email = email;
  STATE.user.loggedIn = true;
  toast('注册成功，欢迎加入 PrintHunt');
  navigate('home');
}

function logout(){
  STATE.user.loggedIn = false;
  STATE.user.email = '';
  STATE.user.name = '';
  localStorage.removeItem('printhunt_user');
  STATE.user.name = '';
  STATE.user.email = '';
  toast('已退出登录');
  navigate('home');
}

function renderBaidupanCallback() {
  // 从URL hash中获取code
  const hash = window.location.hash;
  const codeMatch = hash.match(/[?&]code=([^&]+)/);
  const code = codeMatch ? decodeURIComponent(codeMatch[1]) : null;

  // 异步执行换取token（innerHTML中的script不执行，用setTimeout）
  if (code) {
    setTimeout(function() {
      exchangeBaidupanToken(code).then(function(token) {
        const el = document.getElementById('bd-callback-content');
        if (el) {
          el.innerHTML =
            '<div style="width:64px;height:64px;background:#f6ffed;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px"><span style="font-size:32px;color:var(--success)">✓</span></div>' +

            '<button onclick="STATE.mode=\'admin\';STATE.adminTab=\'settings\';location.hash=\'#/admin\';render()" style="padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">返回管理后台</button>';
        }
      }).catch(function(e) {
        const el = document.getElementById('bd-callback-content');
        if (el) {
          el.innerHTML =
            '<div style="width:64px;height:64px;background:#fff2f0;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px"><span style="font-size:32px;color:var(--danger)">✕</span></div>' +
            '<h2 style="font-size:18px;font-weight:700;color:var(--danger);margin:0 0 8px">授权失败</h2>' +
            '<p style="font-size:13px;color:var(--text-2);margin:0 0 20px">' + e.message + '</p>' +
            '<div style="display:flex;gap:10px;justify-content:center">' +
            '<button onclick="location.hash=\'#/baidupan-auth\'" style="padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">重新授权</button>' +
            '<button onclick="STATE.mode=\'admin\';STATE.adminTab=\'settings\';location.hash=\'#/admin\';render()" style="padding:10px 20px;background:#fff;color:var(--text-2);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer">返回设置</button>' +

  }

  return `<div style="background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="background:#fff;border-radius:16px;padding:40px;max-width:480px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center">

        <div style="width:64px;height:64px;background:var(--primary-light);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>

function getSettings() {
  const defaults = {
    apifyToken: '',
    githubToken: '',
    collectLimit: 30,
    retryCount: 2,
    proxyType: 'auto',
    alertThreshold: 10,
    alertEmail: 'admin@printhunt.com',
    scheduleEnabled: false,
    scheduleTime: '08:00',
    scheduleFrequency: 'daily',
    schedulePlatforms: ['Temu','Etsy','Shein'],
    scheduleLimit: 9,
    lastTestTime: '',
    connectionStatus: 'unknown',
    bdApiKey: '',
    bdSecretKey: '',
    bdUploadPath: '/apps/PrintHunt/designs/',
    storageType: 'local'
  };
  const saved = DB.get('settings', {});
  return {...defaults, ...saved};
}
function saveSettings(s) { DB.set('settings', s); }

function saveAllSettings() {
  const s = getSettings();
  const apifyInput = document.getElementById('apify-token-input');
  const ghInput = document.getElementById('gh-token-input');
  const limitInput = document.getElementById('collect-limit-input');
  const retryInput = document.getElementById('retry-count-input');
  const proxySelect = document.getElementById('proxy-select');
  const alertInput = document.getElementById('alert-threshold-input');
  const emailInput = document.getElementById('alert-email-input');
  const scheduleEnabled = document.getElementById('schedule-enabled');
  const scheduleTime = document.getElementById('schedule-time');
  const scheduleFrequency = document.getElementById('schedule-frequency');
  const scheduleLimit = document.getElementById('schedule-limit');

  if (apifyInput) s.apifyToken = apifyInput.value.trim();
  if (ghInput) { s.githubToken = ghInput.value.trim(); localStorage.setItem('printhunt_gh_token', s.githubToken); }
  if (limitInput) s.collectLimit = parseInt(limitInput.value) || 30;
  if (retryInput) s.retryCount = parseInt(retryInput.value) || 2;
  if (proxySelect) s.proxyType = proxySelect.value;
  if (alertInput) s.alertThreshold = parseFloat(alertInput.value) || 10;
  if (emailInput) s.alertEmail = emailInput.value.trim();
  if (scheduleEnabled) s.scheduleEnabled = scheduleEnabled.checked;
  if (scheduleTime) s.scheduleTime = scheduleTime.value;
  if (scheduleFrequency) s.scheduleFrequency = scheduleFrequency.value;
  if (scheduleLimit) s.scheduleLimit = parseInt(scheduleLimit.value) || 9;

  // 百度网盘配置
  const bdApiKey = document.getElementById('bd-api-key');
  const bdSecretKey = document.getElementById('bd-secret-key');
  const bdUploadPath = document.getElementById('bd-upload-path');
  const storageType = document.getElementById('storage-type');
  if (bdApiKey) s.bdApiKey = bdApiKey.value.trim();
  if (bdSecretKey) s.bdSecretKey = bdSecretKey.value.trim();
  if (bdUploadPath) s.bdUploadPath = bdUploadPath.value.trim();
  if (storageType) s.storageType = storageType.value;

  // 平台选择
  const platforms = [];
  ['Temu','Etsy','Shein'].forEach(p => {
    const cb = document.getElementById('schedule-platform-' + p);
    if (cb && cb.checked) platforms.push(p);
  });
  s.schedulePlatforms = platforms;

  saveSettings(s);
  toast('配置已保存');
}

function toggleApifyToken() {
  const input = document.getElementById('apify-token-input');
  const btn = document.getElementById('apify-token-toggle');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '隐藏'; }
  else { input.type = 'password'; btn.textContent = '显示'; }
}

function testApifyConnection() {
  const s = getSettings();
  const token = s.apifyToken || (document.getElementById('apify-token-input') || {}).value || '';
  if (!token) { toast('请先填写并保存Apify Token'); return; }
  toast('正在测试连接...');
  // 真实调用Apify API验证
  fetch('https://api.apify.com/v2/users/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(r => {
    if (r.ok) return r.json();
    throw new Error('HTTP ' + r.status);
  }).then(data => {
    const s2 = getSettings();
    s2.connectionStatus = 'connected';
    s2.lastTestTime = new Date().toLocaleString();
    s2.apifyUsername = data.data ? data.data.username || data.data.id : 'unknown';
    saveSettings(s2);
    toast('连接成功！用户：' + (s2.apifyUsername || 'unknown'));
    render();
  }).catch(e => {
    const s2 = getSettings();
    s2.connectionStatus = 'failed';
    s2.lastTestTime = new Date().toLocaleString();
    saveSettings(s2);
    toast('连接失败：' + e.message);
    render();
  });
}

function getNextScheduleTime() {
  const s = getSettings();
  if (!s.scheduleEnabled || !s.scheduleTime) return '未启用';
  const [h, m] = s.scheduleTime.split(':').map(Number);
  const now = new Date();
  const next = new Date();
  next.setHours(h, m, 0, 0);
  if (next <= now) {
    if (s.scheduleFrequency === 'daily') next.setDate(next.getDate() + 1);
    else if (s.scheduleFrequency === 'weekly') next.setDate(next.getDate() + 7);
  }
  return next.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function openUploadModal() {

function closeUploadModal() {
  const modal = document.getElementById('upload-modal');
  if (modal) modal.style.display = 'none';
  uploadImageData = null;
}

function handleUploadFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    toast('请选择图片文件');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    toast('图片不能超过10MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    // 用canvas压缩图片，最长边1200px
    const img = new Image();
    img.onload = function() {
      const maxSize = 1200;
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      uploadImageData = canvas.toDataURL('image/png');
      document.getElementById('upload-preview').innerHTML = '<img src="' + uploadImageData + '" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:8px">';
      toast('图片已加载，尺寸：' + w + 'x' + h);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ===== 百度网盘OAuth授权 ===== */
function getBaidupanToken() {
  return DB.get('baidupan_token', null);
}
function saveBaidupanToken(token) {
  DB.set('baidupan_token', token);
}
function clearBaidupanToken() {
  localStorage.removeItem('ph_baidupan_token');
}

function buildBaidupanAuthUrl() {
  const s = getSettings();
  const redirectUri = window.location.origin + window.location.pathname + '#/baidupan-callback';
  const params = new URLSearchParams({
    response_type: 'code',
    client_id: s.bdApiKey,
    redirect_uri: redirectUri,
    scope: 'basic,netdisk',
    display: 'page'
  });
  return 'https://openapi.baidu.com/oauth/2.0/authorize?' + params.toString();
}

function exchangeBaidupanToken(code) {
  const s = getSettings();
  const redirectUri = window.location.origin + window.location.pathname + '#/baidupan-callback';
  const params = new URLSearchParams({
    grant_type: 'authorization_code',
    code: code,
    client_id: s.bdApiKey,
    client_secret: s.bdSecretKey,
    redirect_uri: redirectUri
  });
  return fetch('https://openapi.baidu.com/oauth/2.0/token?' + params.toString(), {
    method: 'GET',
    mode: 'cors'
  }).then(r => r.json()).then(data => {
    if (data.access_token) {
      data.obtained_at = Date.now();
      saveBaidupanToken(data);
      return data;
    } else {
      throw new Error(data.error_description || data.error || '获取token失败');
    }
  });
}

function refreshBaidupanToken() {
  const token = getBaidupanToken();
  const s = getSettings();
  if (!token || !token.refresh_token) return Promise.reject(new Error('无refresh_token'));
  const params = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: token.refresh_token,
    client_id: s.bdApiKey,
    client_secret: s.bdSecretKey
  });
  return fetch('https://openapi.baidu.com/oauth/2.0/token?' + params.toString(), {
    method: 'GET',
    mode: 'cors'
  }).then(r => r.json()).then(data => {
    if (data.access_token) {
      data.obtained_at = Date.now();
      saveBaidupanToken(data);
      return data;
    } else {
      throw new Error(data.error_description || data.error || '刷新token失败');
    }
  });
}

function isBaidupanTokenValid() {
  const token = getBaidupanToken();
  if (!token || !token.access_token || !token.obtained_at) return false;
  const expiresIn = token.expires_in || 2592000; // 默认30天
  return Date.now() - token.obtained_at < expiresIn * 1000 * 0.9; // 90%有效期内
}

            <div style="font-weight:700;font-size:13px;margin-bottom:5px;color:var(--primary)">第一层：AI前置过滤</div>
            <div style="font-size:12px;color:var(--text-2);line-height:1.9">· 黑名单关键词自动拦截<br>· WD14打标识别IP元素<br>· 反向结构排斥降相似度<br>· 相似度>85%自动丢弃</div>
          </div>
          <div style="padding:14px;border:1px solid var(--accent-light);border-radius:8px;background:var(--accent-light)">
            <div style="font-weight:700;font-size:13px;margin-bottom:5px;color:var(--accent)">第二层：人工审核</div>
            <div style="font-size:12px;color:var(--text-2);line-height:1.9">· 运营逐张复核AI产出<br>· 标注低/中/高风险等级<br>· 中高风险二次复检<br>· 合格方可上架前端</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function addBl(){
  const inp=document.getElementById('blInput');const v=inp.value.trim();if(!v)return;
  const tags=document.getElementById('blTags');
  const d=document.createElement('div');d.className='bl-tag';
  d.innerHTML=v+'<span class="rm" onclick="this.parentElement.remove();toast(\'已移除 '+v+'\')">×</span>';
  tags.appendChild(d);inp.value='';toast('已添加 '+v+' 到黑名单');
}

/* ===== 初始化 ===== */
function parseHash(){
  const h=location.hash.slice(1);
  if(h.indexOf('admin')>=0){
    STATE.mode='admin';
    STATE.adminLoggedIn = isAdminLoggedIn();
    const parts=h.split('/');
    if(parts.length>2 && parts[2]){ STATE.adminTab=parts[2]; }
  }else{
    STATE.mode='user';
    const [r,q]=h.split('?');
    STATE.currentRoute=r||'home';
    if(q){const p={};q.split('&').forEach(x=>{const[k,v]=x.split('=');p[k]=decodeURIComponent(v)});STATE.routeParams=p;}
  }
}
function init(){
  parseHash();
  render();
  if(STATE.mode==='admin'){ loadProductsData(); }
  // 首页也加载热销款数据
  loadProductsData().then(()=>{ if(STATE.currentRoute==='home') render(); });
  window.addEventListener('hashchange',()=>{
    parseHash();
    render();
    updateNav();
    if(STATE.mode==='admin' && STATE.adminTab==='collect'){ loadProductsData(); }
  });
}
init();
</script>

      <div>

    <!-- 提示 -->

    <!-- 操作按钮 -->

  </div>
</div>
