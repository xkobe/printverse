/* ===== 工具 ===== */
function navigate(r,params){
  STATE.currentRoute=r;
  if(params)STATE.routeParams=params;
  location.hash=r+(params?'?'+new URLSearchParams(params).toString():'');
  render();updateNav();
}
function updateNav(){
  document.querySelectorAll('.nav-link').forEach(el=>{
    el.classList.toggle('active',el.dataset.route===STATE.currentRoute);
  });
}
function switchMode(m){
  STATE.mode=m;
  document.getElementById('modeUser').classList.toggle('active',m==='user');
  document.getElementById('modeAdmin').classList.toggle('active',m==='admin');
  document.getElementById('navLinks').style.display=m==='admin'?'none':'flex';
  if(m==='admin'){STATE.adminTab='dashboard';STATE.currentRoute='admin';}
  else{STATE.currentRoute='home';}
  render();
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

  if(asset.pattern==='pumpkin')return `<div style="width:60%;height:60%;background:#E67E22;border-radius:50%;position:relative;"><div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:6px;height:10px;background:#27AE60;border-radius:2px;"></div></div>`;

  if(asset.pattern==='skull')return `<div style="width:50%;height:55%;background:rgba(255,255,255,.9);border-radius:40% 40% 30% 30%;position:relative;"><div style="position:absolute;top:35%;left:20%;width:20%;height:20%;background:#2D3436;border-radius:50%;"></div><div style="position:absolute;top:35%;right:20%;width:20%;height:20%;background:#2D3436;border-radius:50%;"></div></div>`;

  if(asset.pattern==='pixel')return `<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:1px;width:70%;height:70%;">${Array.from({length:36},()=>`<div style="background:${Math.random()>0.5?'rgba(255,255,255,.9)':'transparent'};border-radius:1px;"></div>`).join('')}</div>`;
  return `<div style="font-weight:900;letter-spacing:1px;font-size:10px">PRINT</div>`;
}

/* ===== 筛选局部更新（不整页刷新） ===== */
function getFilteredAssets(){
  let list=ASSETS.slice(0,20);
  if(STATE.filter.platform && STATE.filter.platform!=='all'){
    list=list.filter(a=>a.platform===STATE.filter.platform);
  }
  if(STATE.filter.period && STATE.filter.period!=='all'){
    list=list.filter(a=>a.period===STATE.filter.period);
  }
  if(STATE.filter.date){
    list=list.filter(a=>a.date===STATE.filter.date);
  }
  if(STATE.searchKeyword){
    const kw=STATE.searchKeyword.toLowerCase();
    list=list.filter(a=>a.title.toLowerCase().includes(kw)||a.style.toLowerCase().includes(kw)||a.topic.toLowerCase().includes(kw));
  }
  return list;
}
function setFilter(key,val){
  STATE.filter[key]=val;
  const list=getFilteredAssets();
  // 更新筛选标签active状态
  const bar=document.getElementById('filterBar');
  if(bar){
    bar.querySelectorAll('span').forEach(el=>{
      const oc=el.getAttribute('onclick')||'';
      if(oc.includes("'"+key+"','"+val+"'")){
        const color=key==='platform'?'#0175cc':key==='date'?'#52c41a':'#FB5454';
        el.style.background=color;
        el.style.color='#fff';
        el.style.fontWeight='600';
        el.style.borderColor='transparent';
      }else if(oc.includes("setFilter('"+key+"'")){
        el.style.background='#fff';
        el.style.color='#666';
        el.style.fontWeight='400';
        el.style.borderColor='#e0e0e0';
      }
    });
  }
  // 更新计数
  const cnt=document.getElementById('feedCount');
  if(cnt)cnt.textContent='共 '+list.length+' 款';
  // 局部更新列表
  const feed=document.getElementById('assetFeed');
  if(feed){
    feed.innerHTML=list.map(a=>assetCard(a)).join('');
  }
}
function setDateFilter(val){
  STATE.filter.date=val;
  const list=getFilteredAssets();
  const cnt=document.getElementById('feedCount');
  if(cnt)cnt.textContent='共 '+list.length+' 款';
  const feed=document.getElementById('assetFeed');
  if(feed){
    feed.innerHTML=list.map(a=>assetCard(a)).join('');
  }
}

function downloadAsset(id){
  const a=ASSETS.find(x=>x.id==id);
  if(STATE.user.points<a.cost){toast('点数不够，先去充值');setTimeout(()=>navigate('recharge'),1200);return;}
  STATE.user.points-=a.cost;
  document.getElementById('navPoints').textContent=STATE.user.points.toLocaleString();
  toast('下载成功，扣了'+a.cost+'点，授权编号已生成');
}

function addBl(){
  const inp=document.getElementById('blInput');const v=inp.value.trim();if(!v)return;
  const tags=document.getElementById('blTags');
  const d=document.createElement('div');d.className='bl-tag';
  d.innerHTML=v+'<span class="rm" onclick="this.parentElement.remove();toast(\'已移除 '+v+'\')">×</span>';
  tags.appendChild(d);inp.value='';toast('已添加 '+v+' 到黑名单');
}

/* ===== 初始化 ===== */
function init(){
  render();
  window.addEventListener('hashchange',()=>{
    const h=location.hash.slice(1);
    if(h&&!h.startsWith('admin')){
      const [r,q]=h.split('?');
      STATE.currentRoute=r||'home';
      if(q){const p={};q.split('&').forEach(x=>{const[k,v]=x.split('=');p[k]=decodeURIComponent(v)});STATE.routeParams=p;}
      render();updateNav();
    }
  });
}
init();
</script>
